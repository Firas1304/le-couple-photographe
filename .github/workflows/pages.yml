name: Déployer sur GitHub Pages
on:
  push:
    branches: [main, claude/great-cray-w6pth2]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Générer les pages
        run: python3 build.py
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html style.css app.js photos.js robots.txt sitemap.xml _site/
          cp -r services zones palaces villes cultures contact photos _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
